<!DOCTYPE html>  
<html lang="en">  
<head>  
 <meta charset="UTF-8" />  
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />  
 <title>Ascend Institute — Be Ready to Ascend</title>  
 <link rel="preconnect" href="https://fonts.googleapis.com">  
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  
 <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">  
 <style>  
 :root {  
 --navy: #1a2744;  
 --navy-mid: #243259;  
 --navy-light: #2e3f70;  
 --gold: #c9a84c;  
 --gold-light: #e8c97e;  
 --gold-pale: #f5e9c8;  
 --cream: #faf6ed;  
 --cream-dark: #f0e8d4;  
 --white: #ffffff;  
 --text-dark: #1a2744;  
 --text-mid: #3d4f6e;  
 }  
  
 * { margin: 0; padding: 0; box-sizing: border-box; }  
  
 html { scroll-behavior: smooth; }  
  
 body {  
 font-family: "Raleway", sans-serif;  
 background: var(--cream);  
 color: var(--text-dark);  
 overflow-x: hidden;  
 }  
  
   
.logo-option span {  
 display: block;  
 font-size: 9px;  
 text-align: center;  
 color: var(--cream);  
 padding-top: 2px;  
 font-family: Raleway, sans-serif;  
 }  
  
 /* ── NAV ── */  
 nav {  
 position: sticky;  
 top: 0;  
 z-index: 100;  
 background: var(--navy);  
 border-bottom: 1px solid rgba(201,168,76,0.3);  
 display: flex;  
 align-items: center;  
 justify-content: space-between;  
 padding: 14px 48px;  
 max-width: 100%;  
 }  
 .nav-logo {  
 display: flex;  
 align-items: center;  
 gap: 12px;  
 }  
 .nav-logo img {  
 width: 44px;  
 height: 44px;  
 object-fit: contain;  
 border-radius: 4px;  
 }  
 .nav-wordmark {  
 font-family: "Cormorant Garamond", serif;  
 color: var(--gold);  
 font-size: 20px;  
 font-weight: 600;  
 letter-spacing: 2px;  
 text-transform: uppercase;  
 }  
 .nav-wordmark span {  
 display: block;  
 font-size: 10px;  
 letter-spacing: 3px;  
 color: var(--cream-dark);  
 font-weight: 400;  
 }  
 .nav-links {  
 display: flex;  
 gap: 32px;  
 list-style: none;  
 }  
 .nav-links a {  
 color: var(--cream-dark);  
 text-decoration: none;  
 font-size: 12px;  
 letter-spacing: 1.5px;  
 text-transform: uppercase;  
 font-weight: 500;  
 transition: color 0.2s;  
 }  
 .nav-links a:hover { color: var(--gold); }  
 .nav-cta {  
 background: var(--gold);  
 color: var(--navy) !important;  
 padding: 8px 20px;  
 border-radius: 2px;  
 font-weight: 700 !important;  
 }  
 .nav-cta:hover { background: var(--gold-light) !important; color: var(--navy) !important; }  
  
 /* ── HERO ── */  
 .hero {  
 background: var(--navy);  
 min-height: 88vh;  
 display: flex;  
 align-items: center;  
 justify-content: center;  
 padding: 60px 48px;  
 position: relative;  
 overflow: hidden;  
 }  
 .hero::before {  
 content: "";  
 position: absolute;  
 inset: 0;  
 background: radial-gradient(ellipse at 30% 60%, rgba(201,168,76,0.09) 0%, transparent 65%);  
 pointer-events: none;  
 }  
 .hero-inner {  
 max-width: 1100px;  
 width: 100%;  
 display: flex;  
 align-items: center;  
 gap: 72px;  
 position: relative;  
 z-index: 1;  
 }  
 .hero-logo-wrap {  
 flex-shrink: 0;  
 display: flex;  
 align-items: center;  
 justify-content: center;  
 }  
 .hero-logo {  
 width: 280px;  
 height: 280px;  
 object-fit: contain;  
 }  
 .hero-text {  
 flex: 1;  
 text-align: left;  
 }  
 .hero-eyebrow {  
 font-family: "Raleway", sans-serif;  
 font-size: 11px;  
 letter-spacing: 4px;  
 text-transform: uppercase;  
 color: var(--gold);  
 margin-bottom: 20px;  
 }  
 .hero h1 {  
 font-family: "Cormorant Garamond", serif;  
 font-size: clamp(48px, 5.5vw, 88px);  
 font-weight: 300;  
 color: var(--white);  
 line-height: 1.0;  
 margin-bottom: 16px;  
 white-space: nowrap;  
 }  
 .hero h1 em {  
 font-style: italic;  
 color: var(--gold-light);  
 }  
 .hero-sub {  
 font-family: "Cormorant Garamond", serif;  
 font-size: clamp(16px, 2vw, 22px);  
 color: var(--cream-dark);  
 font-weight: 300;  
 font-style: italic;  
 margin-bottom: 20px;  
 line-height: 1.6;  
 }  
 .hero-tagline {  
 font-size: 11px;  
 letter-spacing: 3px;  
 text-transform: uppercase;  
 color: rgba(250,246,237,0.5);  
 margin-bottom: 36px;  
 }  
 .hero-divider {  
 width: 48px;  
 height: 1px;  
 background: var(--gold);  
 margin: 0 0 20px;  
 }  
 .hero-buttons {  
 display: flex;  
 gap: 16px;  
 justify-content: flex-start;  
 flex-wrap: wrap;  
 }  
 .btn-primary {  
 background: var(--gold);  
 color: var(--navy);  
 padding: 14px 36px;  
 font-family: "Raleway", sans-serif;  
 font-size: 12px;  
 font-weight: 700;  
 letter-spacing: 2px;  
 text-transform: uppercase;  
 text-decoration: none;  
 border-radius: 2px;  
 transition: background 0.2s, transform 0.2s;  
 }  
 .btn-primary:hover { background: var(--gold-light); transform: translateY(-1px); }  
 .btn-outline {  
 border: 1px solid var(--gold);  
 color: var(--gold);  
 padding: 14px 36px;  
 font-family: "Raleway", sans-serif;  
 font-size: 12px;  
 font-weight: 600;  
 letter-spacing: 2px;  
 text-transform: uppercase;  
 text-decoration: none;  
 border-radius: 2px;  
 transition: all 0.2s;  
 }  
 .btn-outline:hover { background: rgba(201,168,76,0.1); transform: translateY(-1px); }  
  
 /* ── SECTION SHARED ── */  
 section { padding: 90px 0; }  
 .container { max-width: 1100px; margin: 0 auto; padding: 0 48px; }  
 .section-eyebrow {  
 font-family: "Raleway", sans-serif;  
 font-size: 10px;  
 letter-spacing: 4px;  
 text-transform: uppercase;  
 color: var(--gold);  
 margin-bottom: 12px;  
 }  
 .section-title {  
 font-family: "Cormorant Garamond", serif;  
 font-size: clamp(32px, 5vw, 52px);  
 font-weight: 300;  
 color: var(--navy);  
 margin-bottom: 16px;  
 line-height: 1.15;  
 }  
 .section-title em { font-style: italic; color: var(--gold); }  
 .section-intro {  
 font-size: 16px;  
 line-height: 1.8;  
 color: var(--text-mid);  
 max-width: 680px;  
 }  
 .gold-rule {  
 width: 48px;  
 height: 2px;  
 background: var(--gold);  
 margin: 20px 0 40px;  
 }  
  
 /* ── ORIGIN STORY ── */  
 .origin { background: var(--cream); }  
 .origin-grid {  
 display: grid;  
 grid-template-columns: 1fr 1fr;  
 gap: 64px;  
 align-items: start;  
 margin-top: 40px;  
 }  
 .origin-text p {  
 font-size: 16px;  
 line-height: 1.9;  
 color: var(--text-mid);  
 margin-bottom: 20px;  
 }  
 .origin-quote {  
 border-left: 3px solid var(--gold);  
 padding-left: 24px;  
 margin: 32px 0;  
 }  
 .origin-quote blockquote {  
 font-family: "Cormorant Garamond", serif;  
 font-size: 26px;  
 font-style: italic;  
 color: var(--navy);  
 line-height: 1.5;  
 font-weight: 300;  
 }  
 .origin-quote cite {  
 display: block;  
 font-size: 11px;  
 letter-spacing: 2px;  
 text-transform: uppercase;  
 color: var(--gold);  
 margin-top: 8px;  
 font-style: normal;  
 }  
 .timeline {  
 display: flex;  
 flex-direction: column;  
 gap: 0;  
 }  
 .timeline-item {  
 display: flex;  
 gap: 20px;  
 padding-bottom: 96px;  
 position: relative;  
 }  
 .timeline-item::before {  
 content: "";  
 position: absolute;  
 left: 47px;  
 top: 96px;  
 bottom: 0;  
 width: 1px;  
 background: var(--gold-pale);  
 }  
 .timeline-item:last-child::before { display: none; }  
 .timeline-dot {  
 width: 96px;  
 height: 96px;  
 border-radius: 50%;  
 background: var(--navy);  
 border: 2px solid var(--gold);  
 flex-shrink: 0;  
 display: flex;  
 align-items: center;  
 justify-content: center;  
 }  
 .timeline-dot span {  
 font-size: 18px;  
 font-weight: 700;  
 color: var(--gold);  
 letter-spacing: 0;  
 }  
 .timeline-item:nth-child(4) .timeline-dot {  
 background: var(--gold);  
 border: 2px solid var(--navy);  
 }  
 .timeline-item:nth-child(4) .timeline-dot span {  
 color: var(--navy);  
 }  
 .timeline-quote {  
 border-left: 3px solid var(--gold);  
 padding-left: 24px;  
 margin-top: 24px;  
 }  
 .timeline-quote blockquote {  
 font-family: "Cormorant Garamond", serif;  
 font-size: 22px;  
 font-style: italic;  
 color: var(--navy);  
 line-height: 1.5;  
 font-weight: 300;  
 }  
 .timeline-quote cite {  
 display: block;  
 font-size: 11px;  
 letter-spacing: 2px;  
 text-transform: uppercase;  
 color: var(--gold);  
 margin-top: 10px;  
 font-style: normal;  
 }  
 .timeline-content h4 {  
 font-family: "Cormorant Garamond", serif;  
 font-size: 18px;  
 font-weight: 600;  
 color: var(--navy);  
 margin-bottom: 4px;  
 }  
 .timeline-content p {  
 font-size: 14px;  
 color: var(--text-mid);  
 line-height: 1.6;  
 margin: 0;  
 }  
  
 /* ── IMPACT NUMBERS ── */  
 .impact { background: var(--cream); }  
 .impact .section-title { color: var(--navy); }  
 .impact .section-intro { color: var(--text-mid); }  
 .impact .gold-rule { margin-bottom: 60px; }  
 .stats-grid {  
 display: flex;  
 flex-wrap: wrap;  
 gap: 2px;  
 background: rgba(26,39,68,0.10);  
 border: 1px solid rgba(26,39,68,0.12);  
 border-radius: 4px;  
 overflow: hidden;  
 max-width: 100%;  
 }  
 .stat-card {  
 flex: 1 1 calc(33.333% - 2px);  
 min-width: 200px;  
 background: var(--navy-mid);  
 padding: 36px 24px;  
 text-align: center;  
 transition: background 0.2s;  
 }  
 .stat-card:hover { background: var(--navy-light); }  
 .stat-number {  
 font-family: "Cormorant Garamond", serif;  
 font-size: 52px;  
 font-weight: 300;  
 color: var(--gold);  
 line-height: 1;  
 margin-bottom: 8px;  
 }  
 .stat-label {  
 font-size: 11px;  
 letter-spacing: 1.5px;  
 text-transform: uppercase;  
 color: rgba(250,246,237,0.6);  
 line-height: 1.4;  
 }  
 .stat-category {  
 margin-bottom: 48px;  
 }  
 .stat-category-image {  
 width: 100%;  
 height: clamp(440px, 52vw, 540px);  
 object-fit: cover;  
 object-position: center center;  
 border-radius: 4px;  
 margin-bottom: 20px;  
 display: block;  
 }  
 /* Stats images: consistent sizing with subject-focused crops */  
 .impact .stat-category:nth-of-type(1) .stat-category-image { object-position: 50% 48%; }  
 .impact .stat-category:nth-of-type(2) .stat-category-image { object-position: 42% 45%; }  
 .impact .stat-category:nth-of-type(3) .stat-category-image { object-position: 50% 42%; }  
 .stat-category-label {  
 font-family: "Raleway", sans-serif;  
 font-size: 13px;  
 letter-spacing: 2px;  
 text-transform: uppercase;  
 color: var(--gold);  
 font-weight: 600;  
 margin-bottom: 16px;  
 text-align: left;  
 }  
  
 .origin-quote-full {  
 width: 100vw;  
 margin-left: calc(-50vw + 50%);  
 margin-right: calc(-50vw + 50%);  
 margin-top: 0px;  
 background: var(--cream);  
 text-align: center;  
 padding: 40px 48px 24px;  
 }  
 .origin-quote-full blockquote {  
 font-family: "Cormorant Garamond", serif;  
 font-size: 28px;  
 font-style: italic;  
 color: var(--navy);  
 line-height: 1.5;  
 font-weight: 300;  
 max-width: 800px;  
 margin: 0 auto;  
 }  
 .origin-quote-full cite {  
 display: block;  
 font-size: 11px;  
 letter-spacing: 2px;  
 text-transform: uppercase;  
 color: var(--gold);  
 margin-top: 12px;  
 font-style: normal;  
 }  
 /* ── ASCEND PURPOSE STATEMENT ── */  
 .purpose-section {  
 background: var(--cream);  
 padding: 72px 0 64px;  
 border-top: 1px solid var(--cream-dark);  
 }  
 .purpose-section .section-eyebrow {  
 text-align: left;  
 }  
 .purpose-statement {  
 font-family: "Cormorant Garamond", serif;  
 font-size: clamp(24px, 3vw, 34px);  
 font-weight: 300;  
 color: var(--navy);  
 line-height: 1.35;  
 margin-bottom: 24px;  
 }  
 .purpose-statement em {  
 font-style: italic;  
 color: var(--navy);  
 }  
 .purpose-grid {  
 display: grid;  
 grid-template-columns: repeat(3, 1fr);  
 gap: 20px;  
 margin-top: 28px;  
 }  
 .purpose-card {  
 background: var(--navy);  
 color: var(--cream);  
 border-radius: 4px;  
 padding: 26px 28px 28px;  
 border-top: 4px solid var(--gold);  
 box-shadow: 0 4px 18px rgba(26,39,68,0.08);  
 }  
 .purpose-card h3 {  
 font-family: "Cormorant Garamond", serif;  
 font-size: 26px;  
 font-weight: 600;  
 color: var(--gold);  
 margin-bottom: 10px;  
 }  
 .purpose-card p {  
 font-size: 15px;  
 line-height: 1.75;  
 color: rgba(250,246,237,0.82);  
 }  
  
 /* ── AWARDS STRIP ── */  
 .awards-strip {  
 background: var(--cream);  
 padding: 16px 48px;  
 overflow: hidden;  
 border-top: 1px solid var(--cream-dark);  
 border-bottom: 1px solid var(--cream-dark);  
 }  
 .awards-scroll {  
 display: flex;  
 gap: 0;  
 align-items: stretch;  
 justify-content: center;  
 flex-wrap: nowrap;  
 max-width: 1200px;  
 margin: 0 auto;  
 }  
 .award-item {  
 display: flex;  
 flex-direction: row;  
 align-items: center;  
 justify-content: center;  
 text-align: left;  
 gap: 8px;  
 padding: 8px 18px;  
 border-right: none;  
 flex: 1 1 0;  
 min-width: 0;  
 position: relative;  
 min-height: 58px;  
 }  
 .award-item::after {  
 content: "";  
 position: absolute;  
 right: 0;  
 top: 50%;  
 transform: translateY(-50%);  
 width: 1px;  
 height: 44px;  
 background: rgba(26,39,68,0.12);  
 }  
 .award-item:last-child::after { display: none; }  
 .award-item .award-icon {  
 flex-shrink: 0;  
 width: 36px;  
 height: 36px;  
 filter: drop-shadow(0 1px 4px rgba(139,105,20,0.4));  
 }  
 .award-item .award-text { display: flex; flex-direction: column; gap: 2px; justify-content: center; min-height: 36px; }  
 .award-item .award-title {  
 font-family: "Raleway", sans-serif;  
 font-size: 10px;  
 font-weight: 700;  
 letter-spacing: 1px;  
 text-transform: uppercase;  
 color: var(--navy);  
 line-height: 1.25;  
 }  
 .award-item .award-year {  
 font-size: 9px;  
 color: rgba(26,39,68,0.65);  
 letter-spacing: 0.5px;  
 line-height: 1.25;  
 }  
  
 /* ── PATHWAY ── */  
 .pathway { background: var(--navy); padding: 72px 0; }  
 .pathway-title-row {  
 display: block;  
 max-width: 760px;  
 }  
 .pathway .section-title { color: var(--cream); }  
 .pathway .section-intro { color: rgba(250,246,237,0.72); }  
 .pathway-maslow-callout {  
 display: none;  
 }  
 .pathway-maslow-full {  
 width: 360px;  
 display: block;  
 margin: 0 auto;  
 filter: drop-shadow(0 10px 18px rgba(26,39,68,0.45));  
 }  
 .pathway-maslow-caption {  
 font-family: "Raleway", sans-serif;  
 font-size: 10px;  
 letter-spacing: 1.5px;  
 text-transform: uppercase;  
 color: rgba(250,246,237,0.62);  
 font-weight: 600;  
 margin-top: 8px;  
 }  
 @media (max-width: 768px) {  
 .pathway-maslow-full { width: 220px; }  
 }  
 .pathway-cards {  
 display: flex;  
 flex-direction: column;  
 gap: 58px;  
 margin-top: 52px;  
 }  
 .pathway-card {  
 padding: 0 0 58px;  
 position: relative;  
 overflow: visible;  
 border-radius: 0;  
 border-bottom: 1px solid rgba(201,168,76,0.22);  
 }  
 .pathway-card:last-child {  
 border-bottom: none;  
 padding-bottom: 0;  
 }  
 .pathway-card.ignite,  
 .pathway-card.shift,  
 .pathway-card.launch {  
 background: transparent;  
 border-left: none;  
 }  
 .pathway-card::after { display: none; }  
 .pathway-maslow-badge {  
 position: absolute;  
 top: 16px;  
 right: 16px;  
 width: 130px;  
 border-radius: 3px;  
 overflow: hidden;  
 box-shadow: 0 2px 8px rgba(0,0,0,0.25);  
 z-index: 2;  
 }  
 .pathway-maslow-badge img {  
 width: 100%;  
 display: block;  
 }  
 .pathway-maslow-badge-label {  
 font-size: 8px;  
 letter-spacing: 0.5px;  
 text-transform: uppercase;  
 color: rgba(250,246,237,0.55);  
 text-align: right;  
 margin-top: 4px;  
 }  
 .pathway-text {  
 max-width: 640px;  
 margin: 0 auto;  
 padding: 0;  
 }  
 .pathway-tag {  
 font-size: 14px;  
 letter-spacing: 3px;  
 text-transform: uppercase;  
 color: var(--gold);  
 margin-bottom: 6px;  
 }  
 .pathway-name {  
 font-family: "Cormorant Garamond", serif;  
 font-size: 38px;  
 font-weight: 300;  
 color: var(--white);  
 margin-bottom: 8px;  
 }  
 .pathway-subtitle {  
 font-family: "Cormorant Garamond", serif;  
 font-size: 22px;  
 letter-spacing: 0.3px;  
 text-transform: none;  
 color: var(--gold-light);  
 margin-bottom: 12px;  
 font-weight: 300;  
 font-style: italic;  
 line-height: 1.35;  
 }  
 .pathway-desc {  
 font-size: 21px;  
 line-height: 1.8;  
 color: rgba(250,246,237,0.78);  
 text-align: center;  
 }  
  
 .pathway-logo {  
 width: 180px;  
 height: 180px;  
 object-fit: contain;  
 object-position: center;  
 display: block;  
 margin: 0 auto 12px;  
 background: transparent;  
 mix-blend-mode: normal;  
 }  
 .pathway-photo {  
 width: 100%;  
 height: 360px;  
 object-fit: cover;  
 object-position: center 42%;  
 display: block;  
 margin: 0 0 18px;  
 border-radius: 4px;  
 box-shadow: 0 10px 28px rgba(0,0,0,0.22);  
 }  
 .pathway-card.ignite .pathway-photo { object-position: center 42%; }  
 .pathway-card.shift .pathway-photo { object-position: center 50%; }  
 .pathway-card.launch .pathway-photo { object-position: center 34%; }  
 .pathway-maslow {  
 margin-top: 14px;  
 padding-top: 14px;  
 border-top: 1px solid rgba(201,168,76,0.2);  
 font-size: 17px;  
 font-weight: 700;  
 color: rgba(201,168,76,0.85);  
 letter-spacing: 1px;  
 font-style: italic;  
 text-align: center;  
 }  
  
 /* ── TESTIMONIALS ── */  
 .testimonials { background: var(--cream-dark); }  
 .testimonial-photos {  
 display: grid;  
 grid-template-columns: 1.3fr 1fr;  
 gap: 24px;  
 margin-top: 40px;  
 }  
 .testimonial-photo-card { position: relative; border-radius: 4px; overflow: hidden; min-height: 260px; box-shadow: 0 4px 20px rgba(26,39,68,0.12); }  
 .testimonial-photo-card img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }  
 .testimonial-photo-label {  
 position: absolute;  
 left: 0; right: 0; bottom: 0;  
 padding: 14px 20px;  
 background: linear-gradient(0deg, rgba(26,39,68,0.85) 0%, rgba(26,39,68,0) 100%);  
 font-size: 10px;  
 letter-spacing: 2px;  
 text-transform: uppercase;  
 color: var(--cream);  
 font-weight: 600;  
 }  
 .testimonial-grid {  
 display: grid;  
 grid-template-columns: repeat(3, 1fr);  
 gap: 20px;  
 margin-top: 32px;  
 }  
 .testimonial-card {  
 background: var(--white);  
 border-radius: 4px;  
 padding: 28px 24px;  
 box-shadow: 0 2px 16px rgba(26,39,68,0.07);  
 display: flex;  
 flex-direction: column;  
 }  
 .testimonial-card blockquote {  
 font-family: "Cormorant Garamond", serif;  
 font-size: 17px;  
 font-style: italic;  
 font-weight: 300;  
 color: var(--navy);  
 line-height: 1.55;  
 margin-bottom: 16px;  
 flex-grow: 1;  
 }  
 .testimonial-card cite {  
 font-size: 10px;  
 letter-spacing: 1.5px;  
 text-transform: uppercase;  
 color: var(--gold);  
 font-weight: 700;  
 font-style: normal;  
 }  
 .testimonials-closing {  
 text-align: center;  
 margin-top: 44px;  
 font-family: "Cormorant Garamond", serif;  
 font-size: 22px;
