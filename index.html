<!DOCTYPE html>  
<html lang="en">  
<head>  
 <meta charset="UTF-8" />  
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />  
 <title>Ascend Institute — Be Ready to Ascend</title>  
 <link rel="preconnect" href="https://fonts.googleapis.com">  
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  
 <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">  
 <style>  
 :root {  
 --navy: #1a2744;  
 --navy-mid: #243259;  
 --navy-light: #2e3f70;  
 --gold: #c9a84c;  
 --gold-light: #e8c97e;  
 --gold-pale: #f5e9c8;  
 --cream: #faf6ed;  
 --cream-dark: #f0e8d4;  
 --white: #ffffff;  
 --text-dark: #1a2744;  
 --text-mid: #3d4f6e;  
 }  
  
 * { margin: 0; padding: 0; box-sizing: border-box; }  
  
 html { scroll-behavior: smooth; }  
  
 body {  
 font-family: "Raleway", sans-serif;  
 background: var(--cream);  
 color: var(--text-dark);  
 overflow-x: hidden;  
 }  
  
.logo-option span {  
 display: block;  
 font-size: 9px;  
 text-align: center;  
 color: var(--cream);  
 padding-top: 2px;  
 font-family: Raleway, sans-serif;  
 }  
  
 /* ── NAV ── */  
 nav {  
 position: sticky;  
 top: 0;  
 z-index: 100;  
 background: var(--navy);  
 border-bottom: 1px solid rgba(201,168,76,0.3);  
 display: flex;  
 align-items: center;  
 justify-content: space-between;  
 padding: 14px 48px;  
 max-width: 100%;  
 }  
 .nav-logo {  
 display: flex;  
 align-items: center;  
 gap: 12px;  
 }  
 .nav-logo img {  
 width: 44px;  
 height: 44px;  
 object-fit: contain;  
 border-radius: 4px;  
 }  
 .nav-wordmark {  
 font-family: "Cormorant Garamond", serif;  
 color: var(--gold);  
 font-size: 20px;  
 font-weight: 600;  
 letter-spacing: 2px;  
 text-transform: uppercase;  
 }  
 .nav-wordmark span {  
 display: block;  
 font-size: 10px;  
 letter-spacing: 3px;  
 color: var(--cream-dark);  
 font-weight: 400;  
 }  
 .nav-links {  
 display: flex;  
 gap: 32px;  
 list-style: none;  
 }  
 .nav-links a {  
 color: var(--cream-dark);  
 text-decoration: none;  
 font-size: 12px;  
 letter-spacing: 1.5px;  
 text-transform: uppercase;  
 font-weight: 500;  
 transition: color 0.2s;  
 }  
 .nav-links a:hover { color: var(--gold); }  
 .nav-cta {  
 background: var(--gold);  
 color: var(--navy) !important;  
 padding: 8px 20px;  
 border-radius: 2px;  
 font-weight: 700 !important;  
 }  
 .nav-cta:hover { background: var(--gold-light) !important; color: var(--navy) !important; }  
  
 /* ── HERO ── */  
 .hero {  
 background: var(--navy);  
 min-height: 88vh;  
 display: flex;  
 align-items: center;  
 justify-content: center;  
 padding: 60px 48px;  
 position: relative;  
 overflow: hidden;  
 }  
 .hero::before {  
 content: "";  
 position: absolute;  
 inset: 0;  
 background: radial-gradient(ellipse at 30% 60%, rgba(201,168,76,0.09) 0%, transparent 65%);  
 pointer-events: none;  
 }  
 .hero-inner {  
 max-width: 1100px;  
 width: 100%;  
 display: flex;  
 align-items: center;  
 gap: 72px;  
 position: relative;  
 z-index: 1;  
 }  
 .hero-logo-wrap {  
 flex-shrink: 0;  
 display: flex;  
 align-items: center;  
 justify-content: center;  
 }  
 .hero-logo {  
 width: 280px;  
 height: 280px;  
 object-fit: contain;  
 }  
 .hero-text {  
 flex: 1;  
 text-align: left;  
 }  
 .hero-eyebrow {  
 font-family: "Raleway", sans-serif;  
 font-size: 11px;  
 letter-spacing: 4px;  
 text-transform: uppercase;  
 color: var(--gold);  
 margin-bottom: 20px;  
 }  
 .hero h1 {  
 font-family: "Cormorant Garamond", serif;  
 font-size: clamp(48px, 5.5vw, 88px);  
 font-weight: 300;  
 color: var(--white);  
 line-height: 1.0;  
 margin-bottom: 16px;  
 white-space: nowrap;  
 }  
 .hero h1 em {  
 font-style: italic;  
 color: var(--gold-light);  
 }  
 .hero-sub {  
 font-family: "Cormorant Garamond", serif;  
 font-size: clamp(16px, 2vw, 22px);  
 color: var(--cream-dark);  
 font-weight: 300;  
 font-style: italic;  
 margin-bottom: 20px;  
 line-height: 1.6;  
 }  
 .hero-tagline {  
 font-size: 11px;  
 letter-spacing: 3px;  
 text-transform: uppercase;  
 color: rgba(250,246,237,0.5);  
 margin-bottom: 36px;  
 }  
 .hero-divider {  
 width: 48px;  
 height: 1px;  
 background: var(--gold);  
 margin: 0 0 20px;  
 }  
 .hero-buttons {  
 display: flex;  
 gap: 16px;  
 justify-content: flex-start;  
 flex-wrap: wrap;  
 }  
 .btn-primary {  
 background: var(--gold);  
 color: var(--navy);  
 padding: 14px 36px;  
 font-family: "Raleway", sans-serif;  
 font-size: 12px;  
 font-weight: 700;  
 letter-spacing: 2px;  
 text-transform: uppercase;  
 text-decoration: none;  
 border-radius: 2px;  
 transition: background 0.2s, transform 0.2s;  
 }  
 .btn-primary:hover { background: var(--gold-light); transform: translateY(-1px); }  
 .btn-outline {  
 border: 1px solid var(--gold);  
 color: var(--gold);  
 padding: 14px 36px;  
 font-family: "Raleway", sans-serif;  
 font-size: 12px;  
 font-weight: 600;  
 letter-spacing: 2px;  
 text-transform: uppercase;  
 text-decoration: none;  
 border-radius: 2px;  
 transition: all 0.2s;  
 }  
 .btn-outline:hover { background: rgba(201,168,76,0.1); transform: translateY(-1px); }  
  
 /* ── SECTION SHARED ── */  
 section { padding: 90px 0; }  
 .container { max-width: 1100px; margin: 0 auto; padding: 0 48px; }  
 .section-eyebrow {  
 font-family: "Raleway", sans-serif;  
 font-size: 10px;  
 letter-spacing: 4px;  
 text-transform: uppercase;  
 color: var(--gold);  
 margin-bottom: 12px;  
 }  
 .section-title {  
 font-family: "Cormorant Garamond", serif;  
 font-size: clamp(32px, 5vw, 52px);  
 font-weight: 300;  
 color: var(--navy);  
 margin-bottom: 16px;  
 line-height: 1.15;  
 }  
 .section-title em { font-style: italic; color: var(--gold); }  
 .section-intro {  
 font-size: 16px;  
 line-height: 1.8;  
 color: var(--text-mid);  
 max-width: 680px;  
 }  
 .gold-rule {  
 width: 48px;  
 height: 2px;  
 background: var(--gold);  
 margin: 20px 0 40px;  
 }  
  
 /* ── CTA & CONTACT FORM ── */  
 .cta-section {  
 background: var(--navy);  
 text-align: center;  
 padding: 100px 24px;  
 position: relative;  
 overflow: hidden;  
 }  
 .cta-section::before {  
 content: "";  
 position: absolute;  
 inset: 0;  
 background: radial-gradient(ellipse at 50% 100%, rgba(201,168,76,0.12) 0%, transparent 60%);  
 pointer-events: none;  
 }  
 .cta-section h2 {  
 font-family: "Cormorant Garamond", serif;  
 font-size: clamp(36px, 5vw, 60px);  
 font-weight: 300;  
 color: var(--white);  
 margin-bottom: 16px;  
 position: relative;  
 }  
 .cta-section h2 em { font-style: italic; color: var(--gold-light); }  
 .cta-section p {  
 font-size: 16px;  
 color: rgba(250,246,237,0.7);  
 max-width: 560px;  
 margin: 0 auto 48px;  
 line-height: 1.8;  
 position: relative;  
 }  
  
 .contact-form-wrap {  
 max-width: 600px;  
 margin: 0 auto;  
 background: var(--navy-mid);  
 border: 1px solid rgba(201,168,76,0.25);  
 border-radius: 4px;  
 padding: 48px 40px;  
 position: relative;  
 text-align: left;  
 }  
 .form-row {  
 display: grid;  
 grid-template-columns: 1fr 1fr;  
 gap: 16px;  
 margin-bottom: 16px;  
 }  
 .form-group {  
 display: flex;  
 flex-direction: column;  
 margin-bottom: 16px;  
 }  
 .form-group label {  
 font-size: 10px;  
 letter-spacing: 2px;  
 text-transform: uppercase;  
 color: var(--gold-light);  
 margin-bottom: 6px;  
 font-weight: 600;  
 }  
 .form-group input,  
 .form-group select,  
 .form-group textarea {  
 background: rgba(26,39,68,0.6);  
 border: 1px solid rgba(201,168,76,0.2);  
 border-radius: 2px;  
 color: var(--cream);  
 font-family: "Raleway", sans-serif;  
 font-size: 14px;  
 padding: 12px 14px;  
 outline: none;  
 transition: border-color 0.2s;  
 }  
 .form-group input:focus,  
 .form-group select:focus,  
 .form-group textarea:focus {  
 border-color: var(--gold);  
 }  
 .form-group select option { background: var(--navy); }  
 .form-group textarea { resize: vertical; min-height: 100px; }  
 .form-submit {  
 width: 100%;  
 background: var(--gold);  
 color: var(--navy);  
 border: none;  
 padding: 16px;  
 font-family: "Raleway", sans-serif;  
 font-size: 12px;  
 font-weight: 700;  
 letter-spacing: 2px;  
 text-transform: uppercase;  
 cursor: pointer;  
 border-radius: 2px;  
 transition: background 0.2s;  
 margin-top: 8px;  
 }  
 .form-submit:hover { background: var(--gold-light); }  
  
 /* ── FOOTER ── */  
 footer {  
 background: #111b30;  
 padding: 48px 48px 28px;  
 text-align: center;  
 border-top: 1px solid rgba(201,168,76,0.2);  
 }  
 footer p {  
 font-size: 12px;  
 color: rgba(250,246,237,0.4);  
 letter-spacing: 1px;  
 line-height: 2;  
 }  
  
 @media (max-width: 768px) {  
 .container { padding: 0 20px; }  
 nav { padding: 12px 20px; }  
 .form-row { grid-template-columns: 1fr; }  
 .contact-form-wrap { padding: 32px 24px; }  
 }  
 </style>  
</head>  
<body>  
  
<!-- NAV -->  
 <nav>  
 <div class="nav-logo">  
 <img id="nav-logo-img" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAZAAAAGQCAYAAACAvzbMAAEAAElEQVR42uz9d5xc13nfj3+e55xz7526vQBYdIAFINjAZjaQVKUa1RaUZFmWrTi27Nhx7K9bHHMxjEtcvo4Tx/n+4jhxbMcNK0u2ZUtWJZekxN5JFKIRfReL7WXm3nvOeX5/3AEkWxSLZDuKdN58zWsXi+Xs7GDmfO7TPg8QCAQCgUAgEAgEAoFAIBAIBAKBQCAQCAQCgUAgEAgEAoFAIBAIBAKBQCAQCAQCgUAgEAgEAoFAIBAIBAKBQCAQCAQCgUAgEAgEAoFAIBAIBAKBQCAQCAQCgUAgEAgEAoFAIBAIBAKBQCAQCAQCgUAgEAgEAoFAIBAIBAKBQCAQCAQCgUAgEAgEAoFAIBAIBAL/rAwPD6vh4WEVnolAIBAIfEOICI+MjHB4JgKBv48OT0Eg8DUQhod5Z9z5a1315GEi2g0AIyMjutFoOAASnqJAIBAIfA0jIyMsIvT+D//Qm37u3/7s0V//D41P3n777RcAABFhd0hrBQKBQODrIQICgO3bust3/75/f8f4/33v/Xffv9P99/9218BoB/v994/32v8B/s3b9+37/9u2v31r6d+4M7f+v//z/818f//b//v13v/7/1/33/vf1/b8AABF3A5N6sAABF5l3//wF/sF//13//2v///09///w///d3//z63t7//19//f9v/79/f/9//n3+38+E//" alt="Ascend Institute Logo">  
 </div>  
 </nav>  

<!-- CONTACT SECTION -->
<section class="cta-section" id="contact">
  <div class="container">
    <h2>Get in <em>Touch</em></h2>
    <p>Ready to learn more about our programs or collaborate with us? Fill out the form below and we will get back to you.</p>
    
    <div class="contact-form-wrap">
      <form action="https://formspree.io/f/jsanders@beready2ascend.org" method="POST">
        <div class="form-row">
          <div class="form-group">
            <label for="first-name">First Name</label>
            <input type="text" id="first-name" name="first_name" required />
          </div>
          <div class="form-group">
            <label for="last-name">Last Name</label>
            <input type="text" id="last-name" name="last_name" required />
          </div>
        </div>
        
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required />
        </div>
        
        <div class="form-group">
          <label for="subject">Subject</label>
          <select id="subject" name="subject">
            <option value="General Inquiry">General Inquiry</option>
            <option value="Program Information">Program Information</option>
            <option value="Partnership">Partnership Opportunities</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        
        <button type="submit" class="form-submit">Send Message</button>
      </form>
    </div>
  </div>
</section>

<footer>
  <p>&copy; Ascend Institute. All rights reserved.</p>
</footer>

</body>  
</html>
